[package]
name = "mdcrop-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded synthetic fixture explorer over unchanged MDCROP selection"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mdcrop-explore"
path = "src/main.rs"

[features]
wasm = ["dep:wasm-bindgen", "dep:getrandom"]

[dependencies]
mdcrop-core = { path = "../mdcrop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"], optional = true }
