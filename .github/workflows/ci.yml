name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wasm-boundary:
    name: WASM boundary probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Validate standalone scout
        run: |
          cargo fmt --manifest-path tools/wasm-probe/Cargo.toml --check
          cargo test --locked --manifest-path tools/wasm-probe/Cargo.toml
          cargo build --locked --manifest-path tools/wasm-probe/Cargo.toml --lib --release --target wasm32-unknown-unknown
  rust:
    name: Rust
    runs-on: windows-latest

    steps:
      - name: Use canonical line endings
        run: git config --global core.autocrlf false

      - name: Check out MDCROP
        uses: actions/checkout@v7
        with:
          path: MDCROP

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: MDCROP
        run: cargo fmt -- --check

      - name: Test workspace
        working-directory: MDCROP
        run: cargo test --workspace

      - name: Smoke CLI
        working-directory: MDCROP
        run: cargo run -p mdcrop-cli -- fixture --budget 170

