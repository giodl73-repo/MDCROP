[workspace]
members = [
    "crates/crop-core",
    "crates/crop-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gio Della-Libera"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
mdpath = { git = "https://github.com/giodl73-repo/MDPATH.git", branch = "master" }
pebble = { git = "https://github.com/giodl73-repo/PEBBLE", rev = "80c6e104f99b316f0d8bca5f87a1999feee0d520" }
slice-core = { git = "https://github.com/giodl73-repo/SLICE", package = "slice-core", rev = "ffa956cf8704cae5086af676c9044ae10a9a9b15" }

# Canonical upstream dependencies. Local development can override these with
# .cargo/config.toml copied from .cargo/config.local.example.toml.
rctx-core = { git = "https://github.com/giodl73-repo/RLINE.git", package = "rctx-core", branch = "master" }
rgraph-core = { git = "https://github.com/giodl73-repo/RLINE.git", package = "rgraph-core", branch = "master" }
rstat-core = { git = "https://github.com/giodl73-repo/RLINE.git", package = "rstat-core", branch = "master" }
ropt-core = { git = "https://github.com/giodl73-repo/RLINE.git", package = "ropt-core", branch = "master" }

